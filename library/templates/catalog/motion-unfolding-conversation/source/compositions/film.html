<body>
<template>
<style>
@font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader-Regular-subset.ttf"); font-weight: 400; font-style: normal; }
@font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader-Medium-subset.ttf"); font-weight: 500; font-style: normal; }
@font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader-SemiBold-subset.ttf"); font-weight: 600; font-style: normal; }
@font-face { font-family: "Newsreader"; src: url("assets/fonts/Newsreader-Italic-subset.ttf"); font-weight: 400; font-style: italic; }
@font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk-Regular-subset.ttf"); font-weight: 400; font-style: normal; }
@font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk-Medium-subset.ttf"); font-weight: 500; font-style: normal; }
@font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk-SemiBold-subset.ttf"); font-weight: 600; font-style: normal; }
@font-face { font-family: "Schibsted Grotesk"; src: url("assets/fonts/SchibstedGrotesk-Bold-subset.ttf"); font-weight: 700; font-style: normal; }

#root{position:absolute;inset:0;font-family:"Schibsted Grotesk","Helvetica Neue",sans-serif;color:#1E252C;
  --snow:#F5F8FB; --ink:#1E252C; --secondary:#56626D; --mist:#DCE8F2; --frost:#E3ECF4; --panel:#E8EFF5;
  --cool:#8FA7BB; --copper:#A8714A; --copper2:#C98A5E; --spark1:#E8B381; --line:#E1E8EE;
  --sand:#F2E1D0; --moss:#DCE5DC;}
#root *{box-sizing:border-box}
.bb-beak-open{opacity:0}
.serif{font-family:"Newsreader",Georgia,serif}

/* ---------- layers ---------- */
#backdrop{position:absolute;inset:0;z-index:1}
#furniture{position:absolute;inset:0}
#dotgrid{position:absolute;inset:0;background-image:radial-gradient(#C9D6E0 1.1px, transparent 1.3px);background-size:26px 26px;background-position:13px 10px}
.paper{position:absolute}
#pieceTr{right:-74px;top:64px;width:200px;height:250px;background:#DCE8F2;transform:rotate(4deg)}
#pieceTr2{right:-30px;top:240px;width:120px;height:150px;background:#F2E1D0;transform:rotate(-3deg)}
#pieceBl{left:-58px;bottom:150px;width:190px;height:230px;background:#DCE5DC;transform:rotate(-5deg)}
#pieceBl2{left:26px;bottom:60px;width:96px;height:120px;background:#E3ECF4;transform:rotate(6deg)}
#pieceMr{right:18px;top:470px;width:70px;height:88px;background:#F2E1D0;transform:rotate(8deg)}
.scribble{position:absolute;stroke:#4A545E;fill:none;stroke-width:4;stroke-linecap:round;opacity:.75}
#scr-tl{left:56px;top:76px;width:150px}
#dash-br{right:64px;bottom:88px;width:130px;stroke:#4A545E;stroke-width:3.4;stroke-dasharray:2 14;opacity:.65}
#film-corner{position:absolute;right:34px;bottom:26px;font-family:"Newsreader",Georgia,serif;font-size:23px;color:#1E252C;opacity:.9}

/* ---------- device ---------- */
#device{position:absolute;inset:0;z-index:2}
#devStage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#devFrame{position:relative;width:230px;height:440px;background:#1B2026;border-radius:40px;padding:7px;
  box-shadow:0 22px 44px rgba(30,37,44,.18), 0 2px 0 rgba(255,255,255,.08) inset;flex:none}
#devNotch{position:absolute;left:50%;top:14px;transform:translateX(-50%);width:56px;height:11px;border-radius:7px;background:#101316;z-index:6}
.screen{position:absolute;inset:7px;border-radius:33px;overflow:hidden;background:#FDFEFF}
#scrWide,#scrPortrait2{opacity:0}
#foldline{position:absolute;left:16%;top:10px;bottom:10px;width:2px;background:#B9C8D6;opacity:0;z-index:5}

/* portrait screen (Speak) */
.pt{display:flex;flex-direction:column;align-items:center;padding:34px 16px 18px;background:#F5F8FB}
.pt-head{display:flex;align-items:center;gap:5px;align-self:flex-start;margin:0 0 0 4px}
.pt-head .fw{width:13px;height:22px;transform:rotate(8deg)}
.pt-head .bw{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:17px;letter-spacing:-.2px;position:relative;line-height:1}
.pt-title{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:21px;letter-spacing:-.3px;text-align:center;margin-top:14px;line-height:1.15}
.pt-bird{width:128px;height:124px;margin-top:10px}
.pt-status{margin-top:6px;font-size:12.5px;color:#56626D;display:flex;align-items:center;gap:6px}
.pt-status .dot{width:7px;height:7px;border-radius:50%;background:#A8714A}
.pt-spacer{flex:1}
.pt-mic{width:100%;background:#FFFFFF;border:1px solid #E1E8EE;border-radius:16px;padding:11px 0;text-align:center;font-size:13px;font-weight:600;color:#1E252C;box-shadow:0 1px 2px rgba(60,80,100,.06)}
.pt-type{margin-top:8px;font-size:11.5px;color:#56626D}
.pt-chip{position:absolute;right:12px;top:44px;background:#DCE8F2;color:#3D4A56;border-radius:9px;padding:3px 8px;font-size:11px;font-weight:600}

/* portrait screen after conversation (state carried) */
.pt2 .conv{width:100%;display:flex;flex-direction:column;gap:7px;margin-top:10px}
.bub{max-width:86%;border-radius:13px;padding:7px 10px;font-size:11px;line-height:1.32}
.bub.ai{background:#FFFFFF;border:1px solid #E1E8EE;align-self:flex-start;border-bottom-left-radius:5px;box-shadow:0 1px 2px rgba(60,80,100,.05)}
.bub.me{background:#1E252C;color:#F5F8FB;align-self:flex-end;border-bottom-right-radius:5px}
.tr{font-family:"Newsreader",Georgia,serif;font-style:italic;font-size:11.5px;color:#8FA7BB;margin:-3px 2px 0;align-self:flex-start}

/* wide screen (two panes) */
.wide{display:flex;background:#F5F8FB;border-radius:24px}
.wl{width:37%;background:#E8EFF5;padding:20px 14px 14px;display:flex;flex-direction:column;border-radius:24px 0 0 24px}
.wl-eyebrow{font-size:10.5px;font-weight:600;letter-spacing:1.4px;color:#56626D;text-transform:uppercase}
.wl-title{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:19px;letter-spacing:-.3px;margin-top:3px}
.chips{display:flex;gap:6px;margin:10px 0 10px}
.chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:9px;background:#D3E1EC;color:#3D4A56}
.chip.on{background:#FFFFFF;color:#1E252C;box-shadow:0 1px 2px rgba(60,80,100,.08)}
.trow{display:flex;align-items:center;gap:8px;background:#FFFFFF;border-radius:12px;padding:8px 9px;margin-top:6px;border:1px solid #E1E8EE}
.trow .em{font-size:15px;width:20px;text-align:center;flex:none}
.trow .tt{font-size:11px;font-weight:600;line-height:1.15}
.trow .ts{font-size:10.5px;color:#56626D;margin-top:1px}
.trow.sel{border:1.5px solid #A8714A}
.wr{flex:1;display:flex;flex-direction:column;padding:16px 14px 12px;border-radius:0 0 24px 0;position:relative}
.wr-head{display:flex;align-items:center;gap:8px}
.wr-bird{width:46px;height:44px;flex:none}
.wr-ht{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:16px;letter-spacing:-.2px}
.wr-hs{font-size:10.5px;color:#56626D;margin-top:1px;display:flex;align-items:center;gap:5px}
.wr-hs .dot{width:6px;height:6px;border-radius:50%;background:#A8714A}
.conv2{flex:1;display:flex;flex-direction:column;gap:8px;margin-top:12px}
.conv2 .bub{font-size:12px;border-radius:15px;padding:9px 12px}
.wr-in{display:flex;gap:8px;align-items:center;margin-top:10px}
.wr-field{flex:1;background:#FFFFFF;border:1px solid #E1E8EE;border-radius:13px;padding:9px 12px;font-size:11.5px;color:#56626D}
.wr-mic{width:34px;height:34px;border-radius:50%;background:#A8714A;display:flex;align-items:center;justify-content:center;flex:none}
.wr-mic svg{width:14px;height:14px;fill:#FFFFFF}
.wordchip{position:absolute;right:12px;bottom:64px;background:#FFFFFF;border:1px solid #E1E8EE;border-radius:12px;padding:7px 10px;box-shadow:0 3px 8px rgba(60,80,100,.10);display:flex;align-items:center;gap:8px}
.wordchip .w{font-size:12px;font-weight:700}
.wordchip .m{font-size:11px;color:#56626D;font-style:italic;font-family:"Newsreader",Georgia,serif}
.dots{display:flex;gap:4px}
.rdot{width:9px;height:9px;border-radius:50%;border:1.3px solid #C3D3E1;position:relative;overflow:hidden}
.rdot.f{background:#A8714A;border-color:#A8714A}
.rdot.h{border-color:#A8714A}.rdot.h::after{content:"";position:absolute;left:0;top:0;bottom:0;width:45%;background:#A8714A}
.typing{display:flex;gap:4px;align-items:center;background:#FFFFFF;border:1px solid #E1E8EE;border-radius:15px;border-bottom-left-radius:5px;padding:10px 12px;align-self:flex-start;width:max-content}
.typing i{width:5px;height:5px;border-radius:50%;background:#8FA7BB;display:block}

/* phrase stage */
#phrase{position:absolute;inset:0;z-index:3;background:#F5F8FB;display:flex;align-items:center;justify-content:center}
#film-tagline{font-family:"Newsreader",Georgia,serif;font-weight:400;font-size:62px;line-height:1.22;letter-spacing:-.5px;text-align:center;max-width:600px;color:#1E252C}

/* tent stage */
#tent{position:absolute;inset:0;z-index:4}
#tentStage{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%);width:500px;height:340px}
.tpanel{position:absolute;bottom:24px;width:238px;height:316px;background:#14181D;border-radius:16px;padding:8px;transform-origin:50% 100%}
#tpL{left:6px;box-shadow:-8px 18px 30px rgba(30,37,44,.22)}
#tpR{right:6px;box-shadow:8px 18px 30px rgba(30,37,44,.22)}
.tedge{position:absolute;top:10px;bottom:10px;width:2.5px;background:linear-gradient(#E8B381,#A8714A);opacity:.85;border-radius:2px}
#tpL .tedge{left:-2px}#tpR .tedge{right:-2px}
.tscreen{position:absolute;inset:8px;border-radius:10px;background:#0E1216;overflow:hidden;padding:16px}
#tclock{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:52px;color:#F5F8FB;letter-spacing:-1px;line-height:1}
#ttitle{font-size:13px;color:#DCE8F2;margin-top:10px;font-weight:500}
#tstatus{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#1A2026;border-radius:9px;padding:5px 10px;font-size:11px;color:#E8B381;font-weight:600}
#tstatus .dot{width:6px;height:6px;border-radius:50%;background:#C98A5E}
#tSeyebrow{font-size:10.5px;letter-spacing:1.2px;color:#56626D;text-transform:uppercase;font-weight:600}
#tStitle{font-size:14px;color:#F5F8FB;font-weight:600;margin-top:4px}
#wave{position:absolute;left:20px;right:20px;top:52%;height:44px;display:flex;align-items:center;gap:4px}
#wave i{flex:1;background:linear-gradient(#E8B381,#C98A5E);border-radius:2px;height:100%;transform-origin:center}
.tctrl{position:absolute;left:20px;right:20px;bottom:16px;display:flex;align-items:center;gap:10px}
.tbtn{width:30px;height:30px;border-radius:50%;background:#1A2026;display:flex;align-items:center;justify-content:center}
.tbtn i{width:9px;height:9px;background:#DCE8F2;border-radius:2px}
.tbtn.p i{border-radius:50%;background:transparent;border-left:3.5px solid #DCE8F2;border-right:3.5px solid #DCE8F2;width:10px;height:10px}
#ttime{font-size:12px;color:#8FA7BB;margin-left:auto;letter-spacing:.5px}

/* brand stage */
#brand{position:absolute;inset:0;z-index:5;background:#A8714A;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
#brand .bird{width:172px;height:166px;margin-bottom:6px}
#brandSpark{width:30px;height:30px;margin-bottom:-8px;position:relative;z-index:2}
#brandWord{font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:78px;letter-spacing:-1px;color:#1E252C;line-height:1;position:relative}
#brandWord .sparkdot{position:absolute;top:-16px;right:-4px;width:22px;height:22px}
#film-brandtag{font-family:"Newsreader",Georgia,serif;font-style:italic;font-weight:400;font-size:25px;color:#2E2019;margin-top:14px}
#brandDomain{font-size:15px;font-weight:600;color:#1A0F08;margin-top:12px;letter-spacing:.4px}
#brandBy{font-size:11px;color:#1A0F08;margin-top:4px}
</style>
